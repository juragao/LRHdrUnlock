plugins { id 'com.android.application' }

repositories {
    google()
    mavenCentral()
    maven { url 'https://api.xposed.info/' }
}

android {
    namespace 'com.example.lrhdrunlock'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.lrhdrunlock'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
